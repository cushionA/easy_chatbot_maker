name: Feature request
description: 機能追加・改善の提案
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: なぜこの機能が必要か。現状の困りごと。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
  - type: dropdown
    id: area
    attributes:
      label: 影響範囲
      multiple: true
      options:
        - backend (Blazor / ASP.NET Core)
        - embedding (FastAPI)
        - infra / docker-compose
        - CI / GitHub Actions
        - DB / schema
        - docs
  - type: textarea
    id: notes
    attributes:
      label: 補足
