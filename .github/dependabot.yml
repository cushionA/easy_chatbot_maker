version: 2
updates:
  - package-ecosystem: pip
    directory: /embedding
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      fastapi:
        patterns: ["fastapi", "uvicorn", "pydantic"]
      ml:
        patterns: ["sentence-transformers", "numpy", "torch"]

  - package-ecosystem: docker
    directory: /embedding
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
