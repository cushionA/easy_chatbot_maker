name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedding:
    name: embedding (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embedding
    env:
      FAKE_EMBEDDER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Format check (ruff)
        run: ruff format --check app tests
      - name: Type check (mypy)
        run: mypy app
      - name: Test (pytest)
        run: pytest

  node:
    name: node (TS lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format check (prettier)
        run: npm run format:check
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck

  sql:
    name: sql (sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install sqlfluff==4.2.2
      - run: sqlfluff lint infra/db

  docker-build:
    name: docker images build
    if: false  # Sprint 2 で apps/api・apps/web の新イメージビルドへ置換
    runs-on: ubuntu-latest
    needs: [embedding]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build embedding image
        uses: docker/build-push-action@v7
        with:
          context: ./embedding
          push: false
          tags: portfolio-embedding:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-security:
    name: prompt injection scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Save PR body
        run: |
          mkdir -p .ci
          cat > .ci/pr-body.txt <<'__EOF__'
          ${{ github.event.pull_request.body }}
          __EOF__
      - name: Save diff
        run: git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > .ci/pr.diff
      - name: Run pr-validate.py (vendored)
        run: |
          mkdir -p scripts
          if [ -f .claude/scripts/pr-validate.py ]; then
            python .claude/scripts/pr-validate.py --pr-body .ci/pr-body.txt --diff .ci/pr.diff
          else
            echo "::warning::.claude/scripts/pr-validate.py not present in repo; skipping"
          fi
