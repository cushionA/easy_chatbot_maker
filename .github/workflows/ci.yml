name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Portfolio.sln
      - run: dotnet build Portfolio.sln --configuration Release --no-restore
      - run: dotnet test Portfolio.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: backend/**/TestResults/*.trx

  embedding:
    name: embedding (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embedding
    env:
      FAKE_EMBEDDER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Format check (ruff)
        run: ruff format --check app tests
      - name: Type check (mypy)
        run: mypy app
      - name: Test (pytest)
        run: pytest

  docker-build:
    name: docker images build
    runs-on: ubuntu-latest
    needs: [backend, embedding]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: portfolio-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build embedding image
        uses: docker/build-push-action@v6
        with:
          context: ./embedding
          push: false
          tags: portfolio-embedding:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-security:
    name: prompt injection scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Save PR body
        run: |
          mkdir -p .ci
          cat > .ci/pr-body.txt <<'__EOF__'
          ${{ github.event.pull_request.body }}
          __EOF__
      - name: Save diff
        run: git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > .ci/pr.diff
      - name: Run pr-validate.py (vendored)
        run: |
          mkdir -p scripts
          if [ -f .claude/scripts/pr-validate.py ]; then
            python .claude/scripts/pr-validate.py --pr-body .ci/pr-body.txt --diff .ci/pr.diff
          else
            echo "::warning::.claude/scripts/pr-validate.py not present in repo; skipping"
          fi
