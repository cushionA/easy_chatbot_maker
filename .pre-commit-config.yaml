repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^embedding/
      - id: ruff-format
        files: ^embedding/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-lint
        files: ^infra/db/.*\.sql$

  - repo: local
    hooks:
      - id: prompt-injection-scan
        name: prompt injection scan (staged diff)
        entry: python .claude/scripts/pr-validate.py --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]
      # TS stack: prettier/eslint via the root tooling (run `make install-tooling` first).
      # Scoped to the new code dirs, so these no-op until apps/workers/packages exist.
      - id: prettier
        name: prettier (TS/JS/CSS format check)
        entry: npx --no-install prettier --check
        language: system
        files: ^(apps|workers|packages)/.*\.(ts|tsx|js|jsx|mjs|cjs|css)$
      - id: eslint
        name: eslint (TS)
        entry: npx --no-install eslint --max-warnings=0
        language: system
        files: ^(apps|workers|packages)/.*\.(ts|tsx)$
      - id: commitlint
        name: commitlint (conventional commits)
        entry: npx --no-install commitlint --edit
        language: system
        stages: [commit-msg]
        pass_filenames: false
