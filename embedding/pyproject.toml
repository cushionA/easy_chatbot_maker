[project]
name = "embedding"
version = "0.1.0"
description = "FastAPI embedding service (multilingual-e5-base)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "sentence-transformers>=3.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W=pycodestyle, F=pyflakes, I=isort, B=bugbear, UP=pyupgrade, S=bandit,
# SIM=simplify, RUF=ruff-specific, PL=pylint, TID=tidy-imports, ANN=annotations
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "TID", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: tests that download or run real ML models",
    "integration: tests that touch network or other services",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
